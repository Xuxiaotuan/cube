apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cubestore-metastore
  labels:
    app.kubernetes.io/name: cubestore-metastore
    app.kubernetes.io/component: metastore
spec:
  # A singleton writer has no disruption budget to spend. Block voluntary
  # eviction rather than allowing the only authoritative process to disappear.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cubestore-metastore
      app.kubernetes.io/component: metastore

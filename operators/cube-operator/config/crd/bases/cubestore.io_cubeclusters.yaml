apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cubeclusters.cubestore.io
spec:
  group: cubestore.io
  names:
    kind: CubeCluster
    listKind: CubeClusterList
    plural: cubeclusters
    singular: cubecluster
    shortNames: [cube]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [images, storage]
              properties:
                images:
                  type: object
                  required: [api, router, metaStore, worker, leaseAgent]
                  properties:
                    api: {type: string, minLength: 1}
                    router: {type: string, minLength: 1}
                    metaStore: {type: string, minLength: 1}
                    worker: {type: string, minLength: 1}
                    leaseAgent: {type: string, minLength: 1}
                api:
                  type: object
                  properties: {replicas: {type: integer, format: int32, minimum: 1}}
                router:
                  type: object
                  properties:
                    replicas: {type: integer, format: int32, minimum: 1}
                    highAvailability: {type: boolean, default: true}
                metaStore:
                  type: object
                  description: MetaStore is a single-writer component and must use one replica.
                  properties: {replicas: {type: integer, format: int32, minimum: 1}}
                workers:
                  type: object
                  properties: {replicas: {type: integer, format: int32, minimum: 1}}
                storage:
                  type: object
                  required: [endpoint, bucket]
                  properties:
                    endpoint: {type: string, minLength: 1}
                    bucket: {type: string, minLength: 1}
                    subPath: {type: string}
                    dataSize: {type: string, default: 2Gi}
                    objectStoreSecretRef:
                      type: object
                      required: [name, namespace]
                      properties:
                        name: {type: string, minLength: 1}
                        namespace: {type: string, minLength: 1}
            status:
              type: object
              properties:
                phase: {type: string}
                readyReplicas: {type: integer, format: int32}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, observedGeneration, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cubestorerouters.cubestore.io
spec:
  group: cubestore.io
  names:
    kind: CubestoreRouter
    listKind: CubestoreRouterList
    plural: cubestorerouters
    singular: cubestorerouter
    shortNames:
      - csrouter
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - selector
                - namespace
                - metaStore
                - storage
              properties:
                selector:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                namespace:
                  type: string
                  minLength: 1
                routerPort:
                  type: integer
                  format: int32
                healthPath:
                  type: string
                electionStrategy:
                  type: string
                  default: lease
                  enum:
                    - lease
                roleConfigMapName:
                  type: string
                leaseDurationSeconds:
                  type: integer
                  format: int32
                  default: 30
                  minimum: 1
                renewDeadlineSeconds:
                  type: integer
                  format: int32
                  default: 20
                  minimum: 1
                retryPeriodSeconds:
                  type: integer
                  format: int32
                  default: 5
                  minimum: 1
                stateStore:
                  type: object
                  required:
                    - type
                    - secretRef
                  properties:
                    type:
                      type: string
                      enum:
                        - redis
                        - postgres
                    secretRef:
                      type: object
                      required:
                        - name
                        - namespace
                      properties:
                        name:
                          type: string
                          minLength: 1
                        namespace:
                          type: string
                          minLength: 1
                metaStore:
                  type: object
                  required:
                    - address
                  properties:
                    address:
                      type: string
                      minLength: 1
                storage:
                  type: object
                  required:
                    - dataPVC
                  properties:
                    dataPVC:
                      type: string
                      minLength: 1
                    objectStoreSecretRef:
                      type: object
                      required:
                        - name
                        - namespace
                      properties:
                        name:
                          type: string
                          minLength: 1
                        namespace:
                          type: string
                          minLength: 1
                leaderStateStore:
                  type: object
                  description: Deprecated v1alpha1 migration-only field. Migrate to stateStore; plaintext DSNs are unsupported.
                  x-kubernetes-validations:
                    - rule: (has(self.dsn) && !has(self.secretRef)) || (!has(self.dsn) && has(self.secretRef))
                      message: leaderStateStore migration field must contain exactly one of dsn or secretRef
                  properties:
                    type:
                      type: string
                      enum:
                        - redis
                        - postgres
                    dsn:
                      type: string
                      minLength: 1
                      description: Deprecated plaintext compatibility field. Migrate to stateStore.secretRef and do not use for new objects.
                    secretRef:
                      type: object
                      required:
                        - name
                        - namespace
                      properties:
                        name:
                          type: string
                          minLength: 1
                        namespace:
                          type: string
                          minLength: 1
                    redisKey:
                      type: string
                    pgTable:
                      type: string
                  description: Optional external HA state backend for leader election state.
              x-kubernetes-validations:
                - rule: has(self.stateStore) != has(self.leaderStateStore)
                  message: exactly one of stateStore or the deprecated leaderStateStore migration field must be configured
                - rule: self.renewDeadlineSeconds < self.leaseDurationSeconds
                  message: renewDeadlineSeconds must be less than leaseDurationSeconds
            status:
              type: object
              properties:
                leader:
                  type: string
                leaderRole:
                  type: string
                leaderIP:
                  type: string
                leaderEpoch:
                  type: integer
                  format: int64
                lastSwitchedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - observedGeneration
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                recovery:
                  type: object
                  properties:
                    promotion:
                      type: object
                      properties:
                        state:
                          type: string
                          enum: [Ready, Blocked, NeedsContext]
                        reason:
                          type: string
                        message:
                          type: string
                    jobRecovery:
                      type: object
                      properties:
                        state:
                          type: string
                          enum: [Ready, Blocked, NeedsContext]
                        reason:
                          type: string
                        message:
                          type: string
                    mutationReconcile:
                      type: object
                      properties:
                        state:
                          type: string
                          enum: [Ready, Blocked, NeedsContext]
                        reason:
                          type: string
                        message:
                          type: string
                    refresher:
                      type: object
                      properties:
                        state:
                          type: string
                          enum: [Ready, Blocked, NeedsContext]
                        reason:
                          type: string
                        message:
                          type: string
                candidates:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      role:
                        type: string
                      ip:
                        type: string
                      ready:
                        type: boolean
                      lastProbeTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.leader
          name: Leader
          type: string
        - jsonPath: .status.leaderIP
          name: LeaderIP
          type: string
        - jsonPath: .status.lastSwitchedAt
          name: LastSwitch
          type: date
        - jsonPath: .status.leaderEpoch
          name: LeaderEpoch
          type: integer

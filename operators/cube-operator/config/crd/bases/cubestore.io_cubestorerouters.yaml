apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cubestorerouters.cubestore.io
spec:
  group: cubestore.io
  names:
    kind: CubestoreRouter
    listKind: CubestoreRouterList
    plural: cubestorerouters
    singular: cubestorerouter
    shortNames:
      - csrouter
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                selector:
                  type: object
                  additionalProperties:
                    type: string
                namespace:
                  type: string
                routerPort:
                  type: integer
                  format: int32
                healthPath:
                  type: string
                electionStrategy:
                  type: string
                roleConfigMapName:
                  type: string
                leaderStateStore:
                  type: object
                  properties:
                    type:
                      type: string
                    dsn:
                      type: string
                    redisKey:
                      type: string
                    pgTable:
                      type: string
                  description: Optional external HA state backend for leader election state.
            status:
              type: object
              properties:
                leader:
                  type: string
                leaderRole:
                  type: string
                leaderIP:
                  type: string
                leaderEpoch:
                  type: integer
                  format: int64
                lastSwitchedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - observedGeneration
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                candidates:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      role:
                        type: string
                      ip:
                        type: string
                      ready:
                        type: boolean
                      lastProbeTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.leader
          name: Leader
          type: string
        - jsonPath: .status.leaderIP
          name: LeaderIP
          type: string
        - jsonPath: .status.lastSwitchedAt
          name: LastSwitch
          type: date
        - jsonPath: .status.leaderEpoch
          name: LeaderEpoch
          type: integer

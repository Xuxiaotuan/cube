apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cubestore-router-operator
  namespace: default
rules:
  - apiGroups: ["" ]
    resources: ["pods", "pods/status", "events", "configmaps", "services", "endpoints", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cubestore.io"]
    resources: ["cubestorerouters", "cubestorerouters/status", "cubestorerouters/finalizers", "cubeclusters", "cubeclusters/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

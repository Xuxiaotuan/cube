apiVersion: v1
kind: ServiceAccount
metadata:
  name: cube-worker
  namespace: cube-operator-demo
  labels:
    app: cube-worker
    app.kubernetes.io/name: cube-worker-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cube-worker
  namespace: cube-operator-demo
  labels:
    app: cube-worker
    app.kubernetes.io/name: cube-worker-demo
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cube-worker
  namespace: cube-operator-demo
  labels:
    app: cube-worker
    app.kubernetes.io/name: cube-worker-demo
subjects:
  - kind: ServiceAccount
    name: cube-worker
    namespace: cube-operator-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cube-worker
---
apiVersion: v1
kind: Service
metadata:
  name: cube-worker
  namespace: cube-operator-demo
  labels:
    app: cube-worker
    app.kubernetes.io/name: cube-worker-demo
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: cube-worker
    app.kubernetes.io/name: cube-worker-demo
  ports:
    - name: worker
      port: 10001
      targetPort: worker
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cube-worker-demo
  namespace: cube-operator-demo
  labels:
    app: cube-worker
    app.kubernetes.io/name: cube-worker-demo
spec:
  serviceName: cube-worker
  replicas: 2
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: cube-worker
      app.kubernetes.io/name: cube-worker-demo
  template:
    metadata:
      labels:
        app: cube-worker
        app.kubernetes.io/name: cube-worker-demo
    spec:
      serviceAccountName: cube-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      subdomain: cube-worker
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cubestore-worker
          image: cube-studio-router:ha-local
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBESTORE_SERVER_NAME
              value: "$(POD_NAME).cube-worker.cube-operator-demo.svc:10001"
            - name: CUBESTORE_WORKER_PORT
              value: "10001"
            - name: CUBESTORE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBESTORE_META_ADDR
              valueFrom:
                configMapKeyRef:
                  name: cubestore-metastore-client
                  key: CUBESTORE_META_ADDR
            - name: CUBESTORE_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: cubestore-metastore-client
                  key: CUBESTORE_WORKERS
            - name: CUBESTORE_REMOTE_DIR
              value: /cube/data
            - name: CUBESTORE_DATA_DIR
              value: /cube/.cubestore/data
            - name: CUBESTORE_MINIO_BUCKET
              value: cube-router-ha
            - name: CUBESTORE_MINIO_SUB_PATH
              value: cubestore-demo
            - name: CUBESTORE_MINIO_REGION
              value: us-east-1
            - name: CUBESTORE_MINIO_SERVER_ENDPOINT
              value: http://cube-router-object-store.cube-operator-demo.svc.cluster.local:9000
            - name: CUBESTORE_MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: accessKey
            - name: CUBESTORE_MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: secretKey
          ports:
            - name: worker
              containerPort: 10001
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: worker
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: worker
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 20"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The local demo image currently runs as root. Keep this explicit
            # for the demo only; production images must run non-root and then
            # restore runAsNonRoot: true with an appropriate UID/GID.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: worker-data
              mountPath: /cube/data
            - name: worker-local-data
              mountPath: /cube/.cubestore/data
  volumeClaimTemplates:
    - metadata:
        name: worker-data
        labels:
          app: cube-worker
          app.kubernetes.io/name: cube-worker-demo
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: worker-local-data
        labels:
          app: cube-worker
          app.kubernetes.io/name: cube-worker-demo
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi

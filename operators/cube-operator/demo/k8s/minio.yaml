apiVersion: v1
kind: Secret
metadata:
  name: cube-router-demo-object-store
  namespace: cube-operator-demo
type: Opaque
stringData:
  accessKey: cube-ha-minio
  secretKey: cube-ha-minio-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cube-router-demo-minio-data
  namespace: cube-operator-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cube-router-object-store
  namespace: cube-operator-demo
spec:
  selector:
    app: cube-router-object-store
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-router-object-store
  namespace: cube-operator-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cube-router-object-store
  template:
    metadata:
      labels:
        app: cube-router-object-store
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: secretKey
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cube-router-demo-minio-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cube-router-object-store-init
  namespace: cube-operator-demo
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-bucket
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: secretKey
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until mc alias set local http://cube-router-object-store:9000
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
              mc mb --ignore-existing local/cube-router-ha;
              mc anonymous set private local/cube-router-ha

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-router-demo
  namespace: cube-operator-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cube-router
      app.kubernetes.io/name: cube-router-demo
  template:
    metadata:
      labels:
        app: cube-router
        app.kubernetes.io/name: cube-router-demo
    spec:
      containers:
        - name: lease-agent
          image: cube-operator:dev
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/lease-agent
          args:
            - --cluster-id=cube-router-demo
            - --holder-id=$(POD_NAME)
            - --lease-store-url=$(CUBESTORE_LEASE_STORE_URL)
            - --retry-period=2s
            - --renew-deadline=10s
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBESTORE_LEASE_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-lease-store
                  key: endpoint
          volumeMounts:
            - name: cubestore-ha-leadership
              mountPath: /var/run/cubestore-ha
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: cube-studio-router
          image: ${ROUTER_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: CUBESTORE_SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBESTORE_ROUTER_ROLE_STRICT
              value: "true"
            - name: CUBESTORE_ROUTER_ROLE_FILE
              value: /var/run/cubestore-ha/leadership.json
            - name: CUBESTORE_META_ADDR
              valueFrom:
                configMapKeyRef:
                  name: cubestore-metastore-client
                  key: CUBESTORE_META_ADDR
            - name: CUBESTORE_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: cubestore-metastore-client
                  key: CUBESTORE_WORKERS
            - name: CUBESTORE_HTTP_PORT
              value: "3030"
            - name: CUBESTORE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /router/status
              port: 3030
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /router/status
              port: 3030
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
          ports:
            - containerPort: 3030
            - containerPort: 3306
          volumeMounts:
            - name: cubestore-ha-leadership
              mountPath: /var/run/cubestore-ha
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        # This volume is private to the sidecar and Router in this Pod. It is
        # intentionally not a ConfigMap projection or a Kubernetes lease.
        - name: cubestore-ha-leadership
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: cube-router
  namespace: cube-operator-demo
  labels:
    app: cube-router
spec:
  selector:
    app: cube-router
  ports:
    - name: http
      port: 3030
      targetPort: 3030
    - name: mysql
      port: 3306
      targetPort: 3306

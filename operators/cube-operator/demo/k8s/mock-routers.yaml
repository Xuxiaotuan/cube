apiVersion: v1
kind: Secret
metadata:
  name: cube-router-demo-lease-store
  namespace: cube-operator-demo
type: Opaque
stringData:
  # Keep these values in the deployment Secret. The lease agent reads url and
  # password from the environment; the Operator reads dsn for the same Redis.
  dsn: ${REDIS_URL}
  url: ${REDIS_URL}
  password: "${REDIS_PASSWORD}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-router-demo
  namespace: cube-operator-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cube-router
      app.kubernetes.io/name: cube-router-demo
  template:
    metadata:
      labels:
        app: cube-router
        app.kubernetes.io/name: cube-router-demo
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lease-agent
          image: ${LEASE_AGENT_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/lease-agent
          args:
            - --cluster-id=cube-operator-demo/demo
            - --holder-id=$(POD_NAME)
            - --redis-url=$(REDIS_URL)
            - --redis-prefix=$(CUBESTORE_LEASE_REDIS_PREFIX)
            - --retry-period=2s
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-lease-store
                  key: url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-lease-store
                  key: password
            - name: CUBESTORE_LEASE_REDIS_PREFIX
              value: cube-router/leader-state
          volumeMounts:
            - name: cubestore-ha-leadership
              mountPath: /var/run/cubestore-ha
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The local demo image runs as root. Production images must use a
            # non-root UID and restore runAsNonRoot: true.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
        - name: cube-studio-router
          image: ${ROUTER_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: CUBESTORE_SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBESTORE_ROUTER_ROLE_STRICT
              value: "true"
            - name: CUBESTORE_ROUTER_LEADERSHIP_FILE
              value: /var/run/cubestore-ha/leadership.json
            - name: CUBESTORE_ROUTER_PROMOTION_FILE
              value: /var/run/cubestore-promotion/promotion.json
            - name: CUBESTORE_HTTP_PORT
              value: "3030"
            - name: CUBESTORE_META_ADDR
              value: "${META_STORE_ADDRESS}"
            - name: CUBESTORE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CUBESTORE_DATA_DIR
              value: /cube/.cubestore/data
            - name: CUBESTORE_MINIO_BUCKET
              value: cube-router-ha
            - name: CUBESTORE_MINIO_SUB_PATH
              value: cubestore-demo
            - name: CUBESTORE_MINIO_REGION
              value: us-east-1
            - name: CUBESTORE_MINIO_SERVER_ENDPOINT
              value: http://cube-router-object-store.cube-operator-demo.svc.cluster.local:9000
            - name: CUBESTORE_MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: accessKey
            - name: CUBESTORE_MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cube-router-demo-object-store
                  key: secretKey
          readinessProbe:
            httpGet:
              path: /router/status
              port: 3030
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          ports:
            - containerPort: 3030
            - containerPort: 3306
          volumeMounts:
            - name: cubestore-ha-leadership
              mountPath: /var/run/cubestore-ha
              readOnly: true
            - name: cubestore-promotion
              mountPath: /var/run/cubestore-promotion
              readOnly: true
            - name: router-local-data
              mountPath: /cube/.cubestore/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The local demo image runs as root. Production images must use a
            # non-root UID and restore runAsNonRoot: true.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
      volumes:
        # This volume is private to the sidecar and Router in this Pod. It is
        # intentionally not a ConfigMap projection or a Kubernetes lease.
        - name: cubestore-ha-leadership
          emptyDir:
            medium: Memory
        # This marker is written by the Operator and is never written by the
        # lease-agent. It is separate from the sidecar-owned leadership file.
        - name: cubestore-promotion
          configMap:
            name: cube-router-demo-router-role-state
            optional: true
            items:
              - key: route-role.json
                path: promotion.json
        - name: router-local-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cube-router
  namespace: cube-operator-demo
  labels:
    app: cube-router
spec:
  selector:
    app: cube-router
  ports:
    - name: http
      port: 3030
      targetPort: 3030
    - name: mysql
      port: 3306
      targetPort: 3306

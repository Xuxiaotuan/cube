apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-api-demo
  namespace: cube-operator-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cube-api
  template:
    metadata:
      labels:
        app: cube-api
    spec:
      containers:
        - name: cube-api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: CUBEJS_API_SECRET
              value: cube-router-ha-demo-secret
            - name: CUBEJS_DB_TYPE
              value: cubestore
            - name: CUBEJS_EXT_DB_TYPE
              value: cubestore
            - name: CUBEJS_CUBESTORE_HOST
              value: cube-router-leader.cube-operator-demo.svc.cluster.local
            - name: CUBEJS_CUBESTORE_PORT
              value: "3030"
            # Keep this E2E focused on Router data continuity. CubeStore-backed
            # cache mutations have a separate UNKNOWN-outcome recovery contract.
            - name: CUBEJS_CACHE_AND_QUEUE_DRIVER
              value: memory
            - name: CUBEJS_SCHEMA_PATH
              value: schema
            - name: CUBEJS_PORT
              value: "4000"
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
          ports:
            - name: http
              containerPort: 4000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cube-api
  namespace: cube-operator-demo
spec:
  selector:
    app: cube-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000

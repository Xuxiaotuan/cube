apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cube-operator-demo
  labels:
    app: redis
    app.kubernetes.io/name: cube-router-demo-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      app.kubernetes.io/name: cube-router-demo-redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: cube-router-demo-redis
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cube-operator-demo
  labels:
    app: redis
    app.kubernetes.io/name: cube-router-demo-redis
spec:
  selector:
    app: redis
    app.kubernetes.io/name: cube-router-demo-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

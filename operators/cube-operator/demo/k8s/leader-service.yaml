apiVersion: v1
kind: Service
metadata:
  name: cube-router-leader
  namespace: cube-operator-demo
  labels:
    app: cube-router
spec:
  selector:
    app: cube-router
    cubestore.io/router-role: leader
  ports:
    - name: http
      port: 3030
      targetPort: 3030
    - name: mysql
      port: 3306
      targetPort: 3306

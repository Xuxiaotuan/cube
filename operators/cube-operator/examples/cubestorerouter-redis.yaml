apiVersion: cubestore.io/v1alpha1
kind: CubestoreRouter
metadata:
  name: demo
  namespace: default
spec:
  namespace: default
  selector:
    app: cube-routers
  routerPort: 3030
  healthPath: /router/status
  electionStrategy: strict
  leaderStateStore:
    type: redis
    dsn: "redis://redis.default.svc:6379"
    redisKey: "cube-router/leader-state"

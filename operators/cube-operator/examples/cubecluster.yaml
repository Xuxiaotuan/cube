apiVersion: cubestore.io/v1alpha1
kind: CubeCluster
metadata:
  name: analytics
  namespace: cube-operator-demo
spec:
  images:
    api: cube-studio-api:ha-local
    router: cube-studio-router:ha-local
    metaStore: cube-studio-router:ha-local
    worker: cube-studio-router:ha-local
    leaseAgent: cube-operator:dev
  api:
    replicas: 1
  router:
    replicas: 2
    highAvailability: true
  metaStore:
    replicas: 1
  workers:
    replicas: 2
  storage:
    endpoint: http://cube-router-object-store.cube-operator-demo.svc.cluster.local:9000
    bucket: cube-router-ha
    subPath: cubecluster-analytics
    dataSize: 2Gi
    objectStoreSecretRef:
      name: cube-router-demo-object-store
      namespace: cube-operator-demo
# Optional business configuration (place these fields under spec):
# apiSecretRef: {name: analytics-api-auth, key: apiSecret}
# api:
#   pod:
#     env: [{name: CUBEJS_DB_TYPE, value: postgres}]
#     envFrom: [{secretRef: {name: analytics-datasource}}]
#     volumes: [{name: model, configMap: {name: analytics-model}}]
#     volumeMounts: [{name: model, mountPath: /cube/conf/model, readOnly: true}]
#     resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 1Gi}}
# refresher: {replicas: 1} # inherits API business config; NOT refresher HA
# router:
#   drainCommand: [/cube/cubestored, --drain] # requires a drain-capable image
#   pod: {terminationGracePeriodSeconds: 60}
# storage:
#   storageClassName: fast # immutable after StatefulSet creation
